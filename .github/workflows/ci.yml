# Rust の CLI の CI。検査の中身は Makefile の ci が決め、quality は make setup と make ci だけを呼ぶ。
#
# - ai-usage は macOS だけに配る (Chrome の macOS の Cookie 方式と Keychain を読む) ので、ランナーは macOS だけ
# - quality: make setup と make ci (fmt-check・clippy・test)
# - build: release.yml の build と同じ組 (os / target) でビルドする。release.yml の dry_run では build が
#   走らないので、配布物を作れることはここで確かめる
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # release.yml が配る OS (macOS) だけ
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ツールの版は mise.toml が正。mise 本体は公開から 14 日以上たった最新の版を、署名付きの checksum で
      # 確かめて入れる。cache は切る (効いた回だけ clippy / rustfmt が欠ける。jdx/mise-action#215)
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      # target/ と ~/.cargo のキャッシュ (鍵に rustc の版が入るので、mise.toml の rust を上げると作り直す)
      - uses: Swatinem/rust-cache@v2

      # make setup は make deps も呼び、wreq の BoringSSL のビルドに要る CMake が無ければ Homebrew で入れる
      - run: make setup
      - run: make ci

  build:
    name: Build (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # release.yml の build と同じ組 (行を足したら両方に足す)
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 14d
          cache: false

      # 2 つの target は同じランナーの OS で動くので、target ごとに鍵を分ける (分けないと片方の成果物しか残らない)
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # mise.toml の rust はホストのツールチェーンと components だけを入れるので、配布のターゲットを足す
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      # wreq の BoringSSL のビルドに CMake が要る (ランナーに無ければ Homebrew で入れる。make deps と同じ)
      - name: Install CMake
        run: command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
