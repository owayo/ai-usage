[package]
name = "ai-usage"
version = "26.7.100"
edition = "2024"
rust-version = "1.98"
description = "macOS CLI that shows Claude, Codex, Antigravity, PixelLab, and Grok usage limits across all Chrome profiles and CLI OAuth accounts"
license = "MIT"
repository = "https://github.com/owayo/ai-usage"

[dependencies]
# 暗号: RustCrypto — AES-128-CBC + PBKDF2-HMAC-SHA1(Chrome macOS "v10" Cookie 方式)
aes = "0.9.3"
cbc = { version = "0.2.1", features = ["alloc", "block-padding"] }
pbkdf2 = "0.13.0"
sha1 = "0.11.0"

# 保存 / エンコード
rusqlite = { version = "0.40.2", features = ["bundled"] }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Chrome TLS/HTTP2 エミュレーション付き HTTP(replay した cf_clearance で Cloudflare を通す)
# wreq 5.x / wreq-util 2.x は yank 済み(番号リセット: 5.3.0 → 0.15.3、現行系列は 0.16.x + 0.2.x)。
# `form` は `.form()` に必要(0.16 で opt-in 化)。`system-proxy` は 5.x 既定の macOS
# システムプロキシ検出(旧 `macos-system-configuration`)を維持するため明示する。
wreq = { version = "0.16.1", features = ["gzip", "brotli", "zstd", "deflate", "form", "system-proxy"] }
wreq-util = "0.2.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

# CLI / 出力
clap = { version = "4.6.6", features = ["derive"] }
comfy-table = "8.0.0"
# statusline の手組みパディング用。table 側は comfy-table が内部で同じクレートを使って
# 幅を計算するため、両レンダラーで文字幅の解釈を揃えられる(新規の推移的依存は増えない)。
unicode-width = "0.2.2"
chrono = "0.4.45"
dirs = "7.0.0"
anyhow = "1.0.104"
toml = "1.1.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
