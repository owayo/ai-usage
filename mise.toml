# このリポジトリのツールチェーン。手元 (Makefile 経由) と CI の両方がここを正とする。
# CMake (wreq の BoringSSL のビルドに要る) は mise では入れず、make deps が Homebrew で入れる。

[tools]
# profile と components を明示する。未指定だと rustup の既定の profile 次第で入るものが変わり、
# GitHub Actions のランナー (minimal) では cargo fmt / cargo clippy が無いと言われて落ちる
rust = { version = "1.98.1", profile = "minimal", components = ["rustfmt", "clippy"] }
